<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QC App</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <script>
      // Terapkan tema tersimpan sebelum render pertama agar tidak berkedip. Harus selaras dengan modules/theme/theme.ts
      // (termasuk warna theme-color di bawah: harus sama dengan THEME_COLORS).
      (() => {
        let dark = false;
        try {
          const saved = localStorage.getItem('qc.theme');
          const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches === true;
          dark = saved === 'dark' || ((saved === null || saved === 'system') && systemDark);
        } catch {
          dark = false;
        }
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
        // Bilah sistem mengikuti tema aktif, bukan preferensi OS: setel semua meta theme-color (abaikan atribut media).
        const color = dark ? '#0a0a0a' : '#ffffff';
        for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
          meta.setAttribute('content', color);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
