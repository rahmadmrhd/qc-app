name: Setup Bun dan dependensi
description: >-
  Memasang Bun (versi dipatok, sama dengan Dockerfile), memulihkan cache unduhan bun per bun.lock, lalu
  `bun install --frozen-lockfile`. Jalankan SETELAH actions/checkout. `filter` (mis. '!@qc/desktop') membatasi
  workspace yang dipasang: job server/web tak perlu mengunduh Electron.

inputs:
  filter:
    description: Nilai `bun install --filter`; kosong = semua workspace.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Aksi pihak ketiga dipatok ke SHA commit (tag mayor di komentar). Versi bun harus sama dengan `ARG BUN_VERSION`
    # di Dockerfile (dijaga scripts/ci-workflows.test.ts).
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.2

    # Cache unduhan paket (bukan node_modules): kunci per bun.lock; restore-keys memakai cache terdekat saat lockfile berubah.
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Pasang dependensi
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: |
        set -euo pipefail
        if [ -n "$FILTER" ]; then
          bun install --frozen-lockfile --filter "$FILTER"
        else
          bun install --frozen-lockfile
        fi
