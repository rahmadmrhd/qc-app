name: Deploy Server

# Menggantikan deploy-worker.yml (Cloudflare) untuk server Bun + MariaDB di VPS. Alur: check -> build image dan
# dorong ke GHCR (tag = SHA commit) -> SSH ke VPS (`deploy.sh`: pull, up -d, tunggu sehat, uji /api/ping, kembali ke
# tag sebelumnya bila gagal) -> uji asap lewat URL publik. Lihat docs/ci-cd.md untuk yang harus disiapkan pemilik.
#
# Pemicu:
# - push ke `feat/migrasi-cloudflare` atau `dev`  -> environment `dev`  (staging, qc-dev.rhd.my.id)
# - push ke `main`                                  -> environment `exec` (production, qc.rhd.my.id)
# - workflow_dispatch (target dev|exec)             -> `exec` HANYA dari main; `dev` dari main/dev/feat/migrasi-cloudflare
# Pemicu `push` dipakai (bukan hanya workflow_dispatch) karena GitHub hanya menjalankan/menampilkan
# workflow_dispatch bila berkas workflow ada di branch DEFAULT (main, dibekukan sampai cutover); pemicu push berjalan
# dari berkas di branch yang di-push. Saat cutover (T34) hapus `feat/migrasi-cloudflare` dari daftar branch di bawah.
#
# Tanpa `pull_request`/`pull_request_target`: tidak ada kode PR tak tepercaya yang menyentuh rahasia deploy.
on:
  push:
    branches:
      - main
      - dev
      - feat/migrasi-cloudflare
    # Perubahan yang tak masuk ke image tidak perlu deploy.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'gas/**'
      - 'bridge/**'
      - '.superpowers/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'dev = staging; exec = production (hanya dari branch main)'
        type: choice
        options: [dev, exec]
        default: dev

permissions:
  contents: read

# Satu pipeline per environment pada satu waktu, tanpa membatalkan yang sedang berjalan (GitHub menyimpan paling
# banyak satu run yang menunggu; run menunggu yang lebih lama dibatalkan, sehingga tag lama tak menimpa yang baru).
concurrency:
  group: deploy-server-${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'exec' || 'dev') }}
  cancel-in-progress: false

jobs:
  # Menentukan environment dan menolak kombinasi yang tak diizinkan, SEBELUM kode atau rahasia apa pun disentuh.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      target: ${{ steps.select.outputs.target }}
    steps:
      - name: Tentukan environment
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            push)
              case "$REF" in
                refs/heads/main) target=exec ;;
                refs/heads/dev | refs/heads/feat/migrasi-cloudflare) target=dev ;;
                *) fail "Branch tidak diizinkan untuk deploy server." ;;
              esac
              ;;
            workflow_dispatch)
              case "$INPUT_TARGET" in
                dev | exec) target=$INPUT_TARGET ;;
                *) fail "Target harus dev atau exec." ;;
              esac
              case "$REF" in
                refs/heads/main) ;;
                refs/heads/dev | refs/heads/feat/migrasi-cloudflare)
                  if [ "$target" = exec ]; then fail "Target exec hanya boleh dijalankan dari branch main."; fi
                  ;;
                *) fail "Deploy manual hanya dari main, dev, atau feat/migrasi-cloudflare." ;;
              esac
              ;;
            *) fail "Pemicu tidak didukung." ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"

  # Gerbang: typecheck, Biome, dan semua tes (termasuk server terhadap MariaDB sungguhan di runner).
  check:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QC_TEST_DB_URL: mysql://root:ci-only@127.0.0.1:3306/
    steps:
      # Aksi pihak ketiga dipatok ke SHA commit (tag mayor di komentar; SHA diambil 2026-11-06).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/mariadb

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

  # Build web + image dan dorong ke GHCR dengan tag SHA commit. `docker build` menjalankan `bun run build` (Vite +
  # verify-dist), jadi build web tidak diulang di job check.
  image:
    needs: [meta, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nama repositori GHCR harus huruf kecil; sama dengan bawaan QC_IMAGE di deploy/compose.yml.
      - name: Nama image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qc-app" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=qc-app
          cache-to: type=gha,scope=qc-app,mode=max

  deploy:
    needs: [meta, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Rahasia SSH ada di secret ENVIRONMENT (bukan repositori), sehingga hanya job yang berjalan dari branch yang
    # diizinkan aturan environment yang dapat membacanya. Job ini tidak men-checkout kode apa pun.
    environment: ${{ needs.meta.outputs.target }}
    permissions: {}
    env:
      TARGET: ${{ needs.meta.outputs.target }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for name in SSH_KEY HOST_KEY DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret environment untuk ${name} belum diisi (lihat docs/ci-cd.md)."
              exit 1
            fi
          done
          [[ $DEPLOY_PORT =~ ^[0-9]{1,5}$ ]] || { echo "::error::DEPLOY_PORT tidak valid."; exit 1; }
          [[ $DEPLOY_USER =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "::error::DEPLOY_USER tidak valid."; exit 1; }
          [[ $DEPLOY_HOST =~ ^[A-Za-z0-9.:-]{1,253}$ ]] || { echo "::error::DEPLOY_HOST tidak valid."; exit 1; }
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          # Kunci host dipatok dari secret (hasil ssh-keyscan yang sidik jarinya diperiksa pemilik): koneksi ke host
          # lain ditolak. TIDAK memakai StrictHostKeyChecking=no.
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          {
            echo "Host qc-deploy"
            echo "  HostName $DEPLOY_HOST"
            echo "  Port $DEPLOY_PORT"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 15"
          } > "$HOME/.ssh/config"

      # Kunci SSH di VPS dibatasi `command="/root/apps/qc-app/deploy.sh --only <env>"`: yang dijalankan hanya skrip
      # itu dengan perintah di bawah sebagai SSH_ORIGINAL_COMMAND (divalidasi ketat di sisi VPS). Kode keluar:
      # 0 sukses, 1 gagal dan dikembalikan ke tag sebelumnya, 4 gagal dan pengembalian gagal, 2/3 ditolak/terkunci.
      - name: Deploy di VPS
        run: |
          set -uo pipefail
          [[ $TARGET =~ ^(dev|exec)$ ]] || { echo "::error::Target tidak valid."; exit 1; }
          [[ $TAG =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Tag image bukan SHA commit."; exit 1; }
          ssh qc-deploy "deploy $TARGET $TAG"
          code=$?
          case $code in
            0) ;;
            1) echo "::error::Deploy gagal; VPS dikembalikan ke tag sebelumnya (lihat log di atas)." ;;
            4) echo "::error::Deploy gagal DAN pengembalian gagal: periksa VPS secara manual." ;;
            *) echo "::error::Deploy ditolak atau gagal (kode ${code})." ;;
          esac
          exit "$code"

      - name: Uji asap
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          [[ $APP_URL =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "::error::Variabel environment APP_URL belum diisi atau bukan https://<host>."; exit 1; }
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 15 "$APP_URL/api/ping"
          echo

      - name: Ringkasan
        if: success()
        run: |
          {
            echo "### Deploy server: ${TARGET}"
            echo
            echo "Image tag \`${TAG}\` aktif dan sehat (\`/api/ping\` OK)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Jangan tinggalkan kunci di runner.
      - name: Hapus kredensial SSH
        if: always()
        run: rm -rf "$HOME/.ssh/deploy_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
