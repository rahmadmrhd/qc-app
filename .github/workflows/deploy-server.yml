name: Deploy Server

# Menggantikan deploy-worker.yml (Cloudflare) untuk server Bun + MariaDB di VPS. Alur: check -> build image dan
# dorong ke GHCR (tag = SHA commit) -> SSH ke VPS (`deploy.sh`: pull, up -d, tunggu sehat, uji /api/ping lokal dan lewat nginx dari dalam
# VPS, kembali ke tag sebelumnya bila gagal) -> uji asap publik dari runner (informatif saja). Lihat docs/ci-cd.md untuk yang harus disiapkan pemilik.
#
# Pemicu (keputusan pemilik 2026-11-06, spek §11/§13.2: hanya PR yang di-merge yang men-deploy dev/production):
# - PR di-merge ke `dev`   (pull_request_target, closed + merged) -> environment `staging`    (qc-dev.rhd.my.id)
# - PR di-merge ke `main`  (pull_request_target, closed + merged) -> environment `production` (qc.rhd.my.id)
# - workflow_dispatch (target staging|production)               -> `production` HANYA dari main; `staging` dari main/dev
# Nama environment GitHub = kunci deploy di VPS (folder `<INSTALL_DIR>/<env>` (VPS pribadi: `/root/apps/qc-app/<env>`), `deploy.sh --only`, authorized_keys): staging | production (keputusan pemilik 2026-11-07).
# Push langsung ke `main`/`dev` TIDAK men-deploy (cutover T34 2026-11-07: pemicu `push` dan branch kerja sementara dihapus).
#
# Keamanan `pull_request_target` (menerima rahasia walau PR dari fork): job HANYA berjalan setelah PR di-merge (`if` di
# job `meta` + pemeriksaan di skripnya), dan HANYA meng-checkout commit hasil merge (`merge_commit_sha`, kode yang sudah
# masuk ke branch tujuan) lewat output `sha` job `meta`. Jangan menambah langkah yang meng-checkout atau menjalankan
# head/ref PR yang belum di-merge, dan jangan menambah ekspresi di dalam `run`.
on:
  pull_request_target:
    types: [closed]
    branches: [dev, main]
    # Perubahan yang tak masuk ke image tidak perlu deploy.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.superpowers/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'staging, atau production (hanya dari branch main)'
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# Satu pipeline per environment pada satu waktu, tanpa membatalkan yang sedang berjalan (GitHub menyimpan paling
# banyak satu run yang menunggu; run menunggu yang lebih lama dibatalkan, sehingga tag lama tak menimpa yang baru).
# PR yang ditutup TANPA merge (run dilewati) diberi grup sendiri agar tidak menggantikan run deploy yang menunggu.
concurrency:
  group: deploy-server-${{ (github.event_name == 'pull_request_target' && github.event.pull_request.merged != true) && format('lewati-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && inputs.target || (github.event.pull_request.base.ref == 'main' && 'production' || 'staging')) }}
  cancel-in-progress: false

jobs:
  # Menentukan environment dan commit yang dibangun, serta menolak kombinasi yang tak diizinkan, SEBELUM kode atau
  # rahasia apa pun disentuh. PR yang ditutup tanpa merge dilewati (bukan gagal).
  meta:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      target: ${{ steps.select.outputs.target }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Tentukan environment
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          INPUT_TARGET: ${{ inputs.target }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          sha=$SHA
          case "$EVENT_NAME" in
            pull_request_target)
              # Hanya PR yang SUDAH di-merge; yang dibangun adalah commit hasil merge, bukan head PR.
              [ "$PR_MERGED" = true ] || fail "PR belum di-merge."
              # pull_request_target SELALU berjalan dari branch default (main), apa pun branch tujuan PR (teramati: merge ke dev
              # menghasilkan REF=refs/heads/main); branch tujuan ada di PR_BASE_REF (dari payload event, bukan input pengguna).
              [ "$REF" = refs/heads/main ] || fail "pull_request_target hanya sah dari branch default main."
              case "$PR_BASE_REF" in
                main) target=production ;;
                dev) target=staging ;;
                *) fail "Branch tujuan PR tidak diizinkan untuk deploy server." ;;
              esac
              sha=$PR_MERGE_SHA
              ;;
            workflow_dispatch)
              case "$INPUT_TARGET" in
                staging | production) target=$INPUT_TARGET ;;
                *) fail "Target harus staging atau production." ;;
              esac
              case "$REF" in
                refs/heads/main) ;;
                refs/heads/dev)
                  if [ "$target" = production ]; then fail "Target production hanya boleh dijalankan dari branch main."; fi
                  ;;
                *) fail "Deploy manual hanya dari main atau dev." ;;
              esac
              ;;
            *) fail "Pemicu tidak didukung." ;;
          esac
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || fail "Commit yang dibangun bukan SHA 40 heksa."
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Gerbang: typecheck, Biome, dan semua tes (termasuk server terhadap MariaDB sungguhan di runner).
  check:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QC_TEST_DB_URL: mysql://root:ci-only@127.0.0.1:3306/
    steps:
      # Aksi pihak ketiga dipatok ke SHA commit (tag mayor di komentar; SHA diambil 2026-11-06).
      # `ref` = commit yang ditentukan job `meta` (SHA pemicu, atau commit hasil merge untuk PR); bukan head PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/mariadb

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

  # Build web + image dan dorong ke GHCR dengan tag SHA commit. `docker build` menjalankan `bun run build` (Vite +
  # verify-dist), jadi build web tidak diulang di job check.
  image:
    needs: [meta, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ needs.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nama repositori GHCR harus huruf kecil; sama dengan bawaan QC_IMAGE di deploy/compose.yml.
      - name: Nama image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qc-app" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.image }}:${{ needs.meta.outputs.sha }}
          cache-from: type=gha,scope=qc-app
          # Token `pull_request_target` tak boleh menulis cache GHA ("cache write denied"), jadi hanya dispatch yang menulis; semua event membaca.
          cache-to: ${{ github.event_name == 'workflow_dispatch' && 'type=gha,scope=qc-app,mode=max' || '' }}

  deploy:
    needs: [meta, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Rahasia SSH ada di secret ENVIRONMENT (bukan repositori), sehingga hanya job yang berjalan dari branch yang
    # diizinkan aturan environment yang dapat membacanya. Job ini tidak men-checkout kode apa pun.
    environment: ${{ needs.meta.outputs.target }}
    permissions: {}
    env:
      TARGET: ${{ needs.meta.outputs.target }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for name in SSH_KEY HOST_KEY DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret environment untuk ${name} belum diisi (lihat docs/ci-cd.md)."
              exit 1
            fi
          done
          [[ $DEPLOY_PORT =~ ^[0-9]{1,5}$ ]] || { echo "::error::DEPLOY_PORT tidak valid."; exit 1; }
          [[ $DEPLOY_USER =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "::error::DEPLOY_USER tidak valid."; exit 1; }
          [[ $DEPLOY_HOST =~ ^[A-Za-z0-9.:-]{1,253}$ ]] || { echo "::error::DEPLOY_HOST tidak valid."; exit 1; }
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          # Kunci host dipatok dari secret (hasil ssh-keyscan yang sidik jarinya diperiksa pemilik): koneksi ke host
          # lain ditolak. TIDAK memakai StrictHostKeyChecking=no.
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          {
            echo "Host qc-deploy"
            echo "  HostName $DEPLOY_HOST"
            echo "  Port $DEPLOY_PORT"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 15"
          } > "$HOME/.ssh/config"

      # Kunci SSH di VPS dibatasi `command="<INSTALL_DIR>/deploy.sh --only <env>"` (jalur mutlak lokasi deploy.sh di server; VPS pribadi: /root/apps/qc-app): yang dijalankan hanya skrip
      # itu dengan perintah di bawah sebagai SSH_ORIGINAL_COMMAND (divalidasi ketat di sisi VPS). Kode keluar:
      # 0 sukses, 1 gagal dan dikembalikan ke tag sebelumnya, 4 gagal dan pengembalian gagal, 5 versi baru sehat dan aktif
      # tetapi nginx tidak terjangkau (tidak dikembalikan), 2/3 ditolak/terkunci.
      - name: Deploy di VPS
        run: |
          set -uo pipefail
          [[ $TARGET =~ ^(staging|production)$ ]] || { echo "::error::Target tidak valid."; exit 1; }
          [[ $TAG =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Tag image bukan SHA commit."; exit 1; }
          ssh qc-deploy "deploy $TARGET $TAG"
          code=$?
          case $code in
            0) ;;
            1) echo "::error::Deploy gagal; VPS dikembalikan ke tag sebelumnya (lihat log di atas)." ;;
            4) echo "::error::Deploy gagal DAN pengembalian gagal: periksa VPS secara manual." ;;
            5) echo "::error::Versi baru sehat dan aktif, tetapi nginx di VPS tidak terjangkau (systemctl status nginx / konfigurasi). TIDAK dikembalikan: ini masalah infrastruktur, bukan versi." ;;
            *) echo "::error::Deploy ditolak atau gagal (kode ${code})." ;;
          esac
          exit "$code"

      # INFORMATIF: uji lewat nginx yang menentukan (dan memicu rollback) dilakukan `deploy.sh` dari dalam VPS. Runner GitHub
      # tak dapat diandalkan di sini: Cloudflare memblokir IP datacenter (403) dan origin hanya menerima IP Cloudflare.
      - name: Uji asap publik (informatif)
        continue-on-error: true
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -uo pipefail
          if ! [[ $APP_URL =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::warning::Uji asap publik dilewati: variabel environment APP_URL belum diisi atau bukan https://<host>."
            exit 0
          fi
          if ! curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 15 "$APP_URL/api/ping"; then
            echo "::warning::Uji asap publik gagal (mis. Cloudflare memblokir IP runner). Tidak menggagalkan deploy: kesehatan sudah diuji deploy.sh dari dalam VPS."
            exit 1
          fi
          echo

      - name: Ringkasan
        if: success()
        run: |
          {
            echo "### Deploy server: ${TARGET}"
            echo
            echo "Image tag \`${TAG}\` aktif dan sehat (\`/api/ping\` OK)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Jangan tinggalkan kunci di runner.
      - name: Hapus kredensial SSH
        if: always()
        run: rm -rf "$HOME/.ssh/deploy_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
