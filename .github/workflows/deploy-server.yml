name: Deploy Server

# Deploy server Bun + MariaDB di VPS. Alur: meta -> ci (pemeriksaan terpilih menurut bagian yang berubah, ci.yml) -> build image dan
# dorong ke GHCR (tag = SHA commit; dilewati bila isi image tak berubah, mis. PR hanya `desktop/**`) -> SSH ke VPS (`deploy.sh`: pull, up -d, tunggu sehat, uji /api/ping lokal dan lewat nginx dari dalam
# VPS, kembali ke tag sebelumnya bila gagal) -> uji asap publik dari runner (informatif saja) -> `mark-deployed` mencatat commit itu
# sebagai `refs/deployed/<env>` (dasar pemilihan pemeriksaan run berikutnya). Lihat docs/ci-cd.md untuk yang harus disiapkan pemilik.
#
# Build image dan deploy ke VPS (termasuk `mark-deployed`) dipindah ke workflow yang dapat dipanggil `server-image.yml` dan
# `server-deploy.yml` (rencana rilis semver 2) agar workflow rilis dan deploy tag memakai langkah keamanan yang SAMA; di sini
# `image` dan `deploy` hanya memanggilnya. Perilaku tak berubah.
#
# Pemicu (keputusan pemilik 2026-11-06, spek §11/§13.2: hanya PR yang di-merge yang men-deploy dev/production):
# - PR di-merge ke `dev`   (pull_request_target, closed + merged) -> environment `staging`    (qc-dev.rhd.my.id)
# - PR di-merge ke `main`  (pull_request_target, closed + merged) -> environment `production` (qc.rhd.my.id)
# - workflow_dispatch (target staging|production)               -> `production` HANYA dari main; `staging` dari main/dev
# Nama environment GitHub = kunci deploy di VPS (folder `<INSTALL_DIR>/<env>` (VPS pribadi: `/root/apps/qc-app/<env>`), `deploy.sh --only`, authorized_keys): staging | production (keputusan pemilik 2026-11-07).
# SAKLAR MODE RILIS (keputusan pemilik 2026-11-18): bila variabel repositori `RELEASE_FLOW` bernilai `tag`, merge ke `main` TIDAK
# men-deploy production (job `meta` dilewati): production hanya lewat PR rilis (`release.yml`) atau deploy tag. Kosong atau
# `langsung` (bawaan, masa pra-resmi): perilaku di atas tak berubah. Staging (merge ke `dev`) dan `workflow_dispatch` tak terpengaruh.
# Label `skip-deploy` pada PR (dipasang SEBELUM merge) melewati deploy PR itu (job `meta` dilewati, jadi semua job lain ikut dilewati);
# kodenya tetap ikut ter-deploy oleh deploy berikutnya karena yang dibangun adalah commit hasil merge. `workflow_dispatch` tak terpengaruh.
# Push langsung ke `main`/`dev` TIDAK men-deploy (cutover T34 2026-11-07: pemicu `push` dan branch kerja sementara dihapus).
#
# Keamanan `pull_request_target` (menerima rahasia walau PR dari fork): job HANYA berjalan setelah PR di-merge (`if` di
# job `meta` + pemeriksaan di skripnya), dan HANYA meng-checkout commit hasil merge (`merge_commit_sha`, kode yang sudah
# masuk ke branch tujuan) lewat output `sha` job `meta`. Jangan menambah langkah yang meng-checkout atau menjalankan
# head/ref PR yang belum di-merge, dan jangan menambah ekspresi di dalam `run`.
on:
  pull_request_target:
    types: [closed]
    branches: [dev, main]
    # Perubahan yang tak masuk ke image tidak perlu deploy.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.superpowers/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'staging, atau production (hanya dari branch main)'
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# Satu pipeline per environment pada satu waktu, tanpa membatalkan yang sedang berjalan (GitHub menyimpan paling
# banyak satu run yang menunggu; run menunggu yang lebih lama dibatalkan, sehingga tag lama tak menimpa yang baru).
# PR yang ditutup TANPA merge (run dilewati) diberi grup sendiri agar tidak menggantikan run deploy yang menunggu.
concurrency:
  group: deploy-server-${{ (github.event_name == 'pull_request_target' && (github.event.pull_request.merged != true || contains(github.event.pull_request.labels.*.name, 'skip-deploy') || (github.event.pull_request.base.ref == 'main' && vars.RELEASE_FLOW == 'tag'))) && format('lewati-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && inputs.target || (github.event.pull_request.base.ref == 'main' && 'production' || 'staging')) }}
  cancel-in-progress: false

jobs:
  # Menentukan environment dan commit yang dibangun, serta menolak kombinasi yang tak diizinkan, SEBELUM kode atau
  # rahasia apa pun disentuh. PR yang ditutup tanpa merge dilewati (bukan gagal).
  meta:
    if: github.event_name != 'pull_request_target' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'skip-deploy') && !(github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && vars.RELEASE_FLOW == 'tag'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      target: ${{ steps.select.outputs.target }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Tentukan environment
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          INPUT_TARGET: ${{ inputs.target }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          sha=$SHA
          case "$EVENT_NAME" in
            pull_request_target)
              # Hanya PR yang SUDAH di-merge; yang dibangun adalah commit hasil merge, bukan head PR.
              [ "$PR_MERGED" = true ] || fail "PR belum di-merge."
              # pull_request_target SELALU berjalan dari branch default (main), apa pun branch tujuan PR (teramati: merge ke dev
              # menghasilkan REF=refs/heads/main); branch tujuan ada di PR_BASE_REF (dari payload event, bukan input pengguna).
              [ "$REF" = refs/heads/main ] || fail "pull_request_target hanya sah dari branch default main."
              case "$PR_BASE_REF" in
                main) target=production ;;
                dev) target=staging ;;
                *) fail "Branch tujuan PR tidak diizinkan untuk deploy server." ;;
              esac
              sha=$PR_MERGE_SHA
              ;;
            workflow_dispatch)
              case "$INPUT_TARGET" in
                staging | production) target=$INPUT_TARGET ;;
                *) fail "Target harus staging atau production." ;;
              esac
              case "$REF" in
                refs/heads/main) ;;
                refs/heads/dev)
                  if [ "$target" = production ]; then fail "Target production hanya boleh dijalankan dari branch main."; fi
                  ;;
                *) fail "Deploy manual hanya dari main atau dev." ;;
              esac
              ;;
            *) fail "Pemicu tidak didukung." ;;
          esac
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || fail "Commit yang dibangun bukan SHA 40 heksa."
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Gerbang: pemeriksaan terpilih menurut bagian yang berubah (typecheck, Biome, tes server terbagi 8 job terhadap MariaDB
  # sungguhan di runner, tes web/desktop) dari workflow yang dapat dipanggil ci.yml. `ref` = commit yang ditentukan job
  # `meta` (SHA pemicu, atau commit hasil merge untuk PR); bukan head PR. `since-deploy` = environment target pada PR yang
  # di-merge: perubahan dihitung SEJAK DEPLOY TERAKHIR environment itu (penunjuk `refs/deployed/<env>`, ditulis job
  # `mark-deployed` di bawah), bukan dari berkas PR pemicu saja, jadi PR yang dibuang antrean concurrency atau berlabel
  # `skip-deploy` tak membuat kodenya tertinggal (keputusan pemilik 2026-11-17). Kosong pada dispatch = semua dijalankan.
  # Keluaran `image` = isi image berubah; false (mis. sejak deploy terakhir hanya `desktop/**` atau dokumentasi yang
  # berubah) membuat `image` dan `deploy` dilewati dan run tetap hijau.
  # `packages: read` wajib walau tak dipakai di sini: GitHub memvalidasi izin job di workflow dipanggil (uji bangun PR).
  ci:
    needs: meta
    permissions:
      contents: read
      pull-requests: read
      packages: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.meta.outputs.sha }}
      since-deploy: ${{ github.event_name == 'pull_request_target' && needs.meta.outputs.target || '' }}

  # Build web + image dan dorong ke GHCR dengan tag SHA commit: workflow bersama `server-image.yml` (langkah keamanannya,
  # termasuk kunci tanda tangan UI dan kebijakan cache, hidup di sana dan dipakai juga oleh rilis). Dilewati bila isi image
  # tak berubah (`ci.outputs.image`). Izin pemanggil adalah BATAS bagi job terpanggil: `packages: write` untuk mendorong image.
  # Rahasia environment dibaca job terpanggil lewat `environment:`-nya; pemanggil tak meneruskan rahasia (tanpa `secrets: inherit`).
  image:
    needs: [meta, ci]
    if: needs.ci.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-image.yml
    with:
      target: ${{ needs.meta.outputs.target }}
      sha: ${{ needs.meta.outputs.sha }}

  # Deploy ke VPS lewat SSH lalu catat `refs/deployed/<env>`: workflow bersama `server-deploy.yml`. `contents: write` di sini
  # hanya batas bagi job `mark-deployed` di dalamnya (satu-satunya yang menulis); job `deploy` terpanggil tanpa izin dan tanpa
  # checkout.
  deploy:
    needs: [meta, ci, image]
    if: needs.image.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/server-deploy.yml
    with:
      target: ${{ needs.meta.outputs.target }}
      sha: ${{ needs.meta.outputs.sha }}
