name: Changelog

# Gerbang fragmen changelog di PR (rancangan docs/superpowers/specs/2026-11-17-rilis-semver-design.md bagian 5.2): PR yang
# mengubah kode server/web/desktop harus membawa fragmen baru di `<komponen>/changelog.d/`, kecuali berlabel
# `tanpa-changelog` atau berupa PR rilis (dikenali dari ISI diff, bukan nama cabang; scripts/changelog-check.ts).
#
# Dipisah dari test.yml agar memasang/melepas label tidak mengulang seluruh CI (tes server 8 job + web 4 job). Pemicu
# `pull_request` (bukan `_target`): kode PR berjalan tanpa rahasia dan dengan token baca-saja.
# Catatan: ini peringatan, bukan penghalang merge yang dipaksakan GitHub (branch protection tak tersedia di paket repo ini).
#
# Hanya PR ke `dev` (keputusan pemilik 2026-11-19): di sanalah fragmen menumpuk sampai `release:prepare` merangkumnya. PR ke
# cabang kerja lain (mis. tumpukan PR fitur) dan PR rilis ke `main` tidak diperiksa.
on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fragmen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Token hanya ada di langkah ini (memanggil API, tanpa menjalankan kode dari checkout PR). `pr-files.txt` = semua
      # berkas PR (nama lama rename ikut); `pr-added.txt` = berkas yang DITAMBAH (status added; fragmen yang diubah atau
      # dihapus tidak dihitung sebagai fragmen baru).
      - name: Ambil daftar berkas PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ $PR =~ ^[0-9]+$ ]] || { echo "::error::Nomor PR tidak valid."; exit 1; }
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/pr-files.txt"
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.status == "added") | .filename' > "$RUNNER_TEMP/pr-added.txt"

      # Langkah ini menjalankan skrip dari checkout PR, jadi TANPA token. Semua fragmen yang ada divalidasi bentuknya
      # (nama, satu butir "tipe(area): ringkasan" per baris).
      - name: Periksa fragmen changelog
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          PR_FILES=$(cat "$RUNNER_TEMP/pr-files.txt")
          PR_ADDED=$(cat "$RUNNER_TEMP/pr-added.txt")
          export PR_FILES PR_ADDED
          bun run scripts/changelog-check.ts
          bun run changelog validate server
          bun run changelog validate desktop
