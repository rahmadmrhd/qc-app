name: Test

# Berjalan saat PR dibuka. `reopened` dan `synchronize` ikut agar commit susulan pada PR juga teruji.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tes server memakai MariaDB sungguhan (skema sementara qc_test_* dikloning dari qc_test_template); lihat
      # .github/actions/mariadb. Pengguna root hanya untuk basis data sekali pakai di runner ini.
      QC_TEST_DB_URL: mysql://root:ci-only@127.0.0.1:3306/
    steps:
      # Aksi pihak ketiga dipatok ke SHA commit (tag mayor di komentar; SHA diambil 2026-11-06).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/mariadb

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      # typecheck + Biome + semua test (shared, web, scripts, server).
      - name: Check
        run: bun run check

      # build web ke server/dist + verifikasi (verify-dist: tanpa mock, anggaran potongan JS)
      - name: Build
        run: bun run build

  # Dockerfile harus selalu dapat dibangun (tanpa dorong): menangkap Dockerfile/.dockerignore yang rusak sebelum
  # deploy. Image tidak dijalankan di sini.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          provenance: false
          cache-from: type=gha,scope=qc-app
          cache-to: type=gha,scope=qc-app,mode=max
