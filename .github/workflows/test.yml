name: Test

# Berjalan saat PR dibuka. `reopened` dan `synchronize` ikut agar commit susulan pada PR juga teruji.
#
# Seluruh pemeriksaan ada di ci.yml (dipilih menurut bagian yang berubah: server, web, desktop; tes server dibagi 8 job
# matrix; uji bangun image paralel dengan tes). Job `test` di bawah = GERBANG: status check wajib branch protection
# (docs/ci-cd.md, "Disarankan") menunjuk nama job `test`, jadi gerbang ada di sini dan bukan di ci.yml (nama check dari
# workflow yang dipanggil menjadi `<job pemanggil> / <job>`). Pekerjaan yang dilewati (mis. PR hanya dokumentasi) dihitung
# lulus; gagal atau dibatalkan tidak.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    # pull-requests: daftar berkas PR; packages: baca cache lapisan image di GHCR (uji bangun). Tanpa rahasia.
    permissions:
      contents: read
      pull-requests: read
      packages: read
    uses: ./.github/workflows/ci.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      build-image: true
      desktop-check: true

  test:
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CI_RESULT: ${{ needs.ci.result }}
    steps:
      - name: Periksa hasil
        run: |
          set -uo pipefail
          case "$CI_RESULT" in
            success | skipped) echo "Semua pemeriksaan lulus atau dilewati." ;;
            *)
              echo "::error::Pemeriksaan CI gagal atau dibatalkan (hasil: ${CI_RESULT:-kosong})."
              exit 1
              ;;
          esac
