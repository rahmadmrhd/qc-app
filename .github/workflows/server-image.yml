name: Server Image

# Membangun image server (web + backend) dan mendorongnya ke GHCR. Workflow yang dapat dipanggil, dipakai SAMA oleh
# `deploy-server.yml` (PR/dispatch), `release.yml` (rilis), dan `deploy-tag.yml`, supaya langkah keamanannya (kunci tanda
# tangan UI hanya di sini, kebijakan cache, SHA 40 heksa) tidak punya salinan. Dipindah apa adanya dari job `image` di
# `deploy-server.yml` (rencana rilis semver 2).
#
# Masukan divalidasi di sini (pemanggil tak dipercaya): `target` harus staging|production, `sha` 40 heksa, `extra-tags`
# hanya `server-vX.Y.Z`. Rahasia environment dibaca lewat `environment:` job ini sendiri; pemanggil TIDAK meneruskan rahasia.
on:
  workflow_call:
    inputs:
      target:
        description: 'staging atau production'
        type: string
        required: true
      sha:
        description: 'Commit yang dibangun (40 heksa)'
        type: string
        required: true
      extra-tags:
        description: 'Tag image tambahan (server-vX.Y.Z), satu per baris'
        type: string
        default: ''
    outputs:
      tag:
        description: 'Tag image yang dibangun (= sha)'
        value: ${{ jobs.image.outputs.tag }}

permissions:
  contents: read

jobs:
  # Build web + image dan dorong ke GHCR dengan tag SHA commit. `docker build` menjalankan `bun run build` (Vite +
  # verify-dist), jadi build web tidak diulang di job ci.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secret `UI_SIGNING_KEY` (kunci privat tanda tangan manifest UI desktop) dan Variable `UI_PUBLIC_KEY_PEM` ada di
    # environment yang SAMA dengan target deploy (`staging`/`production`, penempatan pemilik 2026-11-16; aturan branch
    # environment itulah yang membatasi siapa yang boleh membacanya; docs/desktop-ui-signing.md). HANYA job ini (dan
    # `deploy`, yang tak menyentuhnya) memakai environment itu; kunci TIDAK BOLEH ada di test.yml atau workflow lain
    # yang berjalan pada `pull_request` (kode PR yang belum ditinjau).
    environment: ${{ inputs.target }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ inputs.sha }}
    steps:
      # Pemanggil tak dipercaya: tolak masukan yang bentuknya salah SEBELUM checkout atau langkah lain berjalan. (Environment
      # sudah di-resolve saat job dimulai, jadi rahasianya tersedia; langkah ini hanya memastikan tak satu pun dipakai.)
      - name: Validasi masukan
        env:
          TARGET: ${{ inputs.target }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ $TARGET =~ ^(staging|production)$ ]] || { echo "::error::Target harus staging atau production."; exit 1; }
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Commit yang dibangun bukan SHA 40 heksa."; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nama repositori GHCR harus huruf kecil; sama dengan bawaan QC_IMAGE di deploy/compose.yml.
      - name: Nama image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qc-app" >> "$GITHUB_OUTPUT"

      # Daftar tag: selalu `<image>:<sha>`, ditambah tag semver bila rilis. Tiap tag tambahan wajib `server-vX.Y.Z`
      # (tag lain, spasi, atau karakter aneh ditolak; nilai hanya lewat env).
      - name: Susun tag image
        id: tags
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          SHA: ${{ inputs.sha }}
          EXTRA_TAGS: ${{ inputs.extra-tags }}
        run: |
          set -euo pipefail
          {
            echo "list<<QC_TAGS_EOF"
            echo "${IMAGE}:${SHA}"
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              [[ $tag =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag tambahan harus berbentuk server-vX.Y.Z." >&2; exit 1; }
              echo "${IMAGE}:${tag}"
            done <<< "$EXTRA_TAGS"
            echo "QC_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Kebijakan cache lapisan (keputusan pemilik 2026-11-17). Cache registry dapat ditimpa siapa pun yang boleh mendorong
      # branch di repositori ini (peracunan lapisan: lapisan dengan isi lain di bawah kunci cache yang sama), jadi PRODUCTION
      # membangun tanpa cache sama sekali (`no-cache`, bukan hanya tahap web-build: lapisan RUN lain seperti `bun install`
      # dan `apk add` juga ikut ke image runtime). Staging memakai cache; hasil pembangunan production tetap ditulis
      # (`cache-to`) agar staging terbantu. Nilai target hanya lewat env, dan target tak dikenal menggagalkan langkah
      # (tidak diam-diam jatuh ke cache).
      - name: Tentukan kebijakan cache
        id: cache
        env:
          TARGET: ${{ inputs.target }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            production)
              echo "no_cache=true" >> "$GITHUB_OUTPUT"
              echo "cache_from=" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "no_cache=false" >> "$GITHUB_OUTPUT"
              {
                echo "cache_from<<QC_CACHE_EOF"
                echo "type=registry,ref=${IMAGE}:buildcache-staging"
                echo "type=registry,ref=${IMAGE}:buildcache-production"
                echo "QC_CACHE_EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Target cache tidak dikenal."
              exit 1
              ;;
          esac

      # Tanda tangan manifest UI desktop (docs/desktop-ui-signing.md). Kunci privat sampai ke build sebagai BERKAS
      # (`secret-files`, bukan `secrets:` karena nilainya berbaris banyak) dan dihapus di langkah terakhir job.
      # Rollout aman: secret dan variabel sama-sama kosong = tanpa tanda tangan (peringatan, perilaku lama); hanya salah
      # satu terisi = GAGAL, karena konfigurasi setengah jadi membuat semua desktop menolak setiap pembaruan UI.
      # `UI_PUBLIC_KEY_PEM` (kunci publik desktop, bukan rahasia) boleh berbentuk PEM berbaris banyak (akhir baris
      # Unix/Windows), PEM satu baris, atau isi base64 saja; langkah ini menormalkannya menjadi SATU baris isi base64
      # karena `build-args` berformat satu entri per baris. Dockerfile lalu memeriksa kunci privat berpasangan
      # dengannya sebelum menulis tanda tangan.
      - name: Siapkan kunci tanda tangan UI
        id: ui-key
        env:
          UI_SIGNING_KEY: ${{ secrets.UI_SIGNING_KEY }}
          UI_PUBLIC_KEY_PEM: ${{ vars.UI_PUBLIC_KEY_PEM }}
          KEY_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [ -z "$UI_SIGNING_KEY" ] && [ -z "$UI_PUBLIC_KEY_PEM" ]; then
            echo "::warning::Kunci tanda tangan UI belum dikonfigurasi (secret UI_SIGNING_KEY dan variabel UI_PUBLIC_KEY_PEM kosong): manifest UI tidak ditandatangani, pembaruan UI desktop nonaktif."
            echo "secret_files=" >> "$GITHUB_OUTPUT"
            echo "public_key=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$UI_SIGNING_KEY" ] || [ -z "$UI_PUBLIC_KEY_PEM" ]; then
            echo "::error::Konfigurasi tanda tangan UI setengah jadi: secret UI_SIGNING_KEY dan variabel UI_PUBLIC_KEY_PEM harus diisi KEDUANYA (atau keduanya kosong)."
            exit 1
          fi
          public_key=$(printf '%s' "$UI_PUBLIC_KEY_PEM" | sed -e 's/[\\]n//g' | tr -d '[:space:]' | sed -e 's/-----BEGINPUBLICKEY-----//' -e 's/-----ENDPUBLICKEY-----//')
          if ! [[ $public_key =~ ^[A-Za-z0-9+/]+=?=?$ ]]; then
            echo "::error::Variabel UI_PUBLIC_KEY_PEM bukan kunci publik yang dapat dibaca (PEM atau isi base64; lihat docs/desktop-ui-signing.md)."
            exit 1
          fi
          umask 077
          key_file="$KEY_DIR/ui_signing_key.pem"
          printf '%s\n' "$UI_SIGNING_KEY" > "$key_file"
          echo "secret_files=ui_signing_key=$key_file" >> "$GITHUB_OUTPUT"
          echo "public_key=$public_key" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          secret-files: ${{ steps.ui-key.outputs.secret_files }}
          build-args: |
            UI_PUBLIC_KEY_PEM=${{ steps.ui-key.outputs.public_key }}
            GIT_SHA=${{ inputs.sha }}
          # Cache lapisan lewat registry GHCR (bukan cache GHA, yang ditolak untuk token `pull_request_target`): job ini berizin
          # `packages: write`, jadi SEMUA event menulisnya. Tag per environment. Yang DIBACA ditentukan langkah `cache`:
          # staging membaca kedua tag (lapisan web-build yang sama dipakai ulang, jadi perubahan server saja tak membangun
          # ulang aset web); production tanpa cache.
          no-cache: ${{ steps.cache.outputs.no_cache }}
          cache-from: ${{ steps.cache.outputs.cache_from }}
          cache-to: type=registry,ref=${{ steps.name.outputs.image }}:buildcache-${{ inputs.target }},mode=max,image-manifest=true,oci-mediatypes=true

      # Jangan tinggalkan kunci di runner.
      - name: Hapus kunci tanda tangan UI
        if: always()
        env:
          KEY_DIR: ${{ runner.temp }}
        run: rm -f "$KEY_DIR/ui_signing_key.pem"
